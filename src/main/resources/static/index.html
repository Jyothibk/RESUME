<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Resume Analyzer</h1>
        <p>Paste your resume below to get AI-powered feedback.</p>
        
        <form id="resumeForm">
            <div class="form-group">
                <label for="candidateName">Candidate Name:</label>
                <input type="text" id="candidateName" name="candidateName" required placeholder="e.g., Jyothi">
            </div>
            
            <div class="form-group">
                <label for="resumeText">Resume Content:</label>
                <textarea id="resumeText" name="resumeText" rows="10" required placeholder="Paste the text of your resume here..."></textarea>
            </div>
            
            <button type="submit" id="analyzeBtn">Analyze Resume</button>
        </form>

        <div id="loading" class="hidden">Analyzing your resume... Please wait.</div>

        <div id="resultSection" class="hidden">
            <h2>Analysis Results</h2>
            <div class="score-card">
                <h3>Match Score: <span id="matchScore"></span>%</h3>
            </div>
            <div class="feedback-card">
                <h3>AI Feedback:</h3>
                <p id="aiFeedback"></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
